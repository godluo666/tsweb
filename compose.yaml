services:
  tsweb:
    image: ghcr.io/godluo666/tsweb:latest
    restart: unless-stopped
    environment:
      TS_HOST: ${TS_HOST:?请设置现有 TeamSpeak 服务器地址}
      TS_PORT: ${TS_PORT:-9987}
      TS_PASSWORD: ${TS_PASSWORD:-}
      SERVER_NAME: ${SERVER_NAME:-TeamSpeak}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      TS_SECURITY_LEVEL: ${TS_SECURITY_LEVEL:-8}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - tsweb-data:/app/data
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  tsweb-data:
