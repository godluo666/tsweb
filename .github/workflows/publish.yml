name: Test and publish Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: bash -n deploy.sh
      - name: Validate one-command deployment configuration
        run: bash test/deploy.test.sh
      - name: Start TeamSpeak test server
        run: docker run -d --name tsweb-test-ts -e TS3SERVER_LICENSE=accept -p 9987:9987/udp teamspeak:3.13.7
      - name: Test real TeamSpeak voice and text
        run: node --test test/live.integration.js
        env:
          TS_HOST: 127.0.0.1
      - name: Show TeamSpeak logs on failure
        if: failure()
        run: docker logs tsweb-test-ts || true

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/godluo666/tsweb
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published container
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run -d --name tsweb-smoke -p 127.0.0.1:8080:8080 -e TS_HOST=example.test "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q TSWeb
          docker exec tsweb-smoke node --input-type=module -e "import OpusScript from 'opusscript'; const encoder=new OpusScript(48000,1,OpusScript.Application.VOIP); if(!encoder.encode(Buffer.alloc(1920),960).length)process.exit(1); encoder.delete()"
      - name: Create version release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" deploy.sh compose.yaml --title "TSWeb $GITHUB_REF_NAME" --notes "TeamSpeak 网页语音与频道聊天。镜像：ghcr.io/godluo666/tsweb:${GITHUB_REF_NAME#v}。一键部署见 README。"
